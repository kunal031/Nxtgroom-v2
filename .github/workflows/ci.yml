name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject retired backend, uploads, and committed environment files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^grooming_api_v2/|(^|/)temp_uploads/|(^|/)\.env($|\.))' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden tracked files detected:"
            echo "$forbidden"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grooming_api_node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grooming_api_node/package-lock.json
      - run: npm ci
      # Without this, the DynamoDB transaction tests skip instead of running:
      # dynalite does not implement TransactWriteItems.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch DynamoDB Local
        run: |
          mkdir -p "$RUNNER_TEMP/dynamodb-local"
          curl -sSL https://d1ni2b6xgvw0s0.cloudfront.net/v2.x/dynamodb_local_latest.tar.gz \
            | tar xz -C "$RUNNER_TEMP/dynamodb-local"
          echo "DYNAMODB_LOCAL_JAR=$RUNNER_TEMP/dynamodb-local/DynamoDBLocal.jar" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grooming-frontend
    env:
      VITE_API_BASE: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grooming-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm audit --audit-level=moderate

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
